.bf{--ink:#edf1f8;--muted:#adb9ce;--line:#41465b;--teal:#81e4cc;--gold:#f2cb86;color:var(--ink);background:#141821;font:14px/1.55 "Yu Gothic UI",Meiryo,sans-serif;border:1px solid #41485b;border-radius:12px;overflow:hidden;min-width:0;container-type:inline-size;color-scheme:dark}
.bf *{box-sizing:border-box}.bf-inner{padding:clamp(10px,2.2cqw,24px)}.bf h2,.bf h3,.bf p{margin:0}.bf h2{font-size:clamp(18px,3.5cqw,32px);letter-spacing:.05em;font-weight:750}.bf h3{font-size:18px}.bf small{font-size:12px;color:var(--muted)}.bf p{color:#d6dfed;margin:10px 0;line-height:1.7}.bf img{image-rendering:auto;display:block;object-fit:contain}
.bf button,.bf select{font:inherit}.bf button{cursor:pointer;background:#272e3f;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 13px}.bf button:hover:enabled,.bf button.active{background:#364455;border-color:var(--teal)}.bf button:focus-visible,.bf select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}.bf button:disabled{opacity:.48;cursor:default}.bf button.primary{background:var(--teal);color:#102a29;border-color:var(--teal);font-weight:750}.bf button.primary:hover{background:#abf5dd;color:#102a29}
.bf-heading,.bf-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}.bf-heading h2{margin-right:auto}.bf-material{color:var(--gold);font-variant-numeric:tabular-nums}.bf-mainmenu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.bf button.bf-menu-item{text-align:left;padding:14px 12px;background:#202736}.bf-menu-item strong,.bf-menu-item small{display:block}.bf-menu-item strong{font-size:16px}.bf-select{display:grid;gap:3px;flex:1 1 auto}.bf select{border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#222a39;color:var(--ink);max-width:100%}
.bf-brief,.bf-detail{background:#202637;padding:14px;margin:12px 0;border:1px solid var(--line);border-radius:8px;display:flow-root}.bf-brief img,.bf-detail img{width:96px;float:left;margin:0 16px 8px 0}.bf-detail img{width:min(30%,192px);border-radius:5px}.bf-detail .bf-row{margin:10px 0 0}.bf-chapters{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}.bf-chapters button{font-size:12px}.bf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:7px;max-height:520px;overflow-y:auto;padding:3px;scrollbar-color:#637189 #202430}
.bf button.bf-tile{position:relative;display:flex;align-items:stretch;flex-direction:column;background:#232a38;overflow:hidden;padding:0;border:1px solid #525b6b;border-radius:6px;min-width:0;text-align:left}.bf-tile img{width:100%;aspect-ratio:4/3;object-fit:cover}.bf-tile strong,.bf-tile small{padding:3px 6px;display:block;line-height:1.35}.bf-tile strong{font-size:12px}.bf-tile small{font-size:10px;margin-top:auto;color:#c9d0e1}.bf-price{position:absolute;top:3px;left:3px;background:#111d2e;color:#c9fff3;border:1px solid #9ae4d2;min-width:20px;padding:0 3px;text-align:center;border-radius:4px;font-size:13px}.bf .rarity-R{border-bottom:3px solid #7fb7e0!important}.bf .rarity-SR{border-bottom:3px solid #c79bea!important}.bf .rarity-UR{border-bottom:3px solid var(--gold)!important}
.bf-hand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.bf-hand .bf-tile.selected{outline:2px solid var(--teal);outline-offset:1px}.bf-hand .expensive img{filter:brightness(.65)}.bf-hint{min-height:2em;font-size:12px}.bf-charge{accent-color:var(--teal);width:80px;height:7px}.bf-pause,.bf-mission{background:#232c3a;border-radius:6px;padding:10px;margin-top:10px}.bf-pause button{margin-right:6px}.bf-drops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.bf-reward{display:grid;background:#222a39;padding:7px;border-radius:6px}.bf-reward img{width:100%}.bf-notice{color:var(--gold)!important}
@container(max-width:540px){.bf-mainmenu{grid-template-columns:repeat(2,1fr)}.bf button.bf-menu-item{padding:9px}.bf-menu-item small{font-size:10px}.bf-tile strong{font-size:10px}.bf-hand .bf-tile small{font-size:9px}.bf-brief img{width:64px}.bf-row{gap:5px}.bf-heading{margin-bottom:8px}.bf-heading button,.bf-row button{padding:5px 8px}.bf-select small{font-size:10px}}
.bf .bf-keyword-note {color:var(--muted);font-size:12px;margin:4px 0 9px}

.bf-arena {
  --arena-ink:#f5f6fb;
  --arena-gold:#b88d56;
  --arena-player:#86e9df;
  --arena-cpu:#ffa79d;
}
.bf-readout {
  position:relative;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:clamp(12px,4.6cqw,58px);
  margin-bottom:8px;
}
.bf-readout::after {
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:clamp(5px,1.1cqw,12px);
  aspect-ratio:1;
  translate:-50% -50%;
  rotate:45deg;
  border:1px solid var(--arena-gold);
  background:#2b2630;
  box-shadow:0 0 0 3px #af884c20;
  pointer-events:none;
}
.bf-leader {
  --team:var(--arena-player);
  position:relative;
  display:flex;
  align-items:center;
  gap:clamp(5px,1.2cqw,14px);
  min-width:0;
  padding:clamp(4px,.9cqw,9px);
  border:1px solid color-mix(in srgb,var(--team) 31%,#252c3e);
  border-inline-start:2px solid var(--team);
  border-radius:5px 12px 5px 5px;
  background:linear-gradient(120deg,color-mix(in srgb,var(--team) 12%,#121e30),#10192b 68%);
  box-shadow:inset 0 1px 0 #ffffff10,0 5px 12px #070c1680;
}
.bf-leader.cpu {
  --team:var(--arena-cpu);
  flex-direction:row-reverse;
  text-align:right;
  border-inline-start-width:1px;
  border-inline-end:2px solid var(--team);
  border-radius:12px 5px 5px 5px;
  background:linear-gradient(-120deg,color-mix(in srgb,var(--team) 12%,#121e30),#10192b 68%);
}
.bf-arena-hud[data-low-player] .bf-leader.player,.bf-arena-hud[data-low-cpu] .bf-leader.cpu {
  border-color:#f69783;
  box-shadow:inset 0 0 18px #d54b5140,0 2px 10px #1b080d95;
}
.bf .bf-leader img {
  width:clamp(31px,6.7cqw,68px);
  flex:none;
  aspect-ratio:1;
  object-fit:cover;
  background:#151f31;
  border:1px solid color-mix(in srgb,var(--team) 60%,#24344a);
  border-radius:4px;
  box-shadow:0 1px 6px #070b14bd;
}
.bf-leader-status {
  flex:1;
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:baseline;
  gap:3px 7px;
  color:var(--arena-ink);
}
.bf-leader-status span {font-size:clamp(10px,2.1cqw,17px);font-weight:740;overflow-wrap:anywhere}
.bf-leader-status strong {color:var(--team);font:800 clamp(11px,2.3cqw,19px)/1.15 Consolas,monospace;white-space:nowrap}
.bf-leader-status small {grid-column:1/-1;font-size:clamp(8px,1.65cqw,12px);line-height:1.45;color:#d0d9e9}
.bf-hud-resources {grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 10px}
.bf-leader.cpu .bf-hud-resources {justify-content:flex-end}
.bf-hud-resources:empty {display:none}
.bf-leader-status .bf-bond-status {color:#ffcfdd}
.bf-health {
  grid-column:1/-1;
  appearance:none;
  width:100%;
  height:clamp(4px,.85cqw,8px);
  border:0;
  background:#26364d;
  border-radius:2px;
  color:var(--team);
  accent-color:var(--team);
}
.bf-health::-webkit-progress-bar {background:#26364d;border-radius:2px;box-shadow:inset 0 1px 3px #080e1b}
.bf-health::-webkit-progress-value {background:linear-gradient(90deg,color-mix(in srgb,var(--team) 69%,#274057),var(--team));border-radius:2px;box-shadow:0 0 5px color-mix(in srgb,var(--team) 35%,transparent)}
.bf-health::-moz-progress-bar {background:var(--team);border-radius:2px}

.bf-resource {
  --resource-accent:#e6b77c;
  min-width:0;
}
.bf-resource[data-resource="clues"] {--resource-accent:#ddbbff}
.bf-resource[data-resource="treasure"] {--resource-accent:#ffd77c}
.bf-resource[data-resource="charge"] {--resource-accent:#85f4e0}
.bf-resource[data-resource="applause"] {--resource-accent:#ffc2e0}
.bf-resource[data-resource="types"] {--resource-accent:#9de5f6}
.bf-resource-row,.bf-resource-types {
  display:flex;
  gap:2px 5px;
  align-items:center;
  flex-wrap:wrap;
}
.bf-leader.cpu :is(.bf-resource-row,.bf-resource-types) {justify-content:flex-end}
.bf-resource-label {
  color:var(--resource-accent);
  font-size:clamp(10px,1.7cqw,12px);
  line-height:1.2;
  white-space:nowrap;
}
.bf-leader-status .bf-resource-value {
  font:750 clamp(10px,1.7cqw,13px)/1.2 Consolas,monospace;
  white-space:nowrap;
  color:#edf2fb;
}
.bf-resource-pips {
  display:flex;
  gap:3px;
  align-items:center;
}
.bf-resource-pip {
  width:clamp(6px,.95cqw,9px);
  aspect-ratio:1;
  border:1px solid color-mix(in srgb,var(--resource-accent) 45%,#33415d);
  border-radius:2px;
  background:#142033;
}
.bf-resource-pip[data-filled] {
  border-color:var(--resource-accent);
  background:var(--resource-accent);
  box-shadow:0 0 4px color-mix(in srgb,var(--resource-accent) 37%,transparent);
}
.bf-arena-resource-help .bf-resource-hint {display:block;color:#d0d9e9;font-size:.95em}
.bf-leader-status .bf-resource-delta {
  color:#a1efd8;
  font:750 clamp(9px,1.55cqw,12px)/1 Consolas,monospace;
  white-space:nowrap;
}
.bf-leader-status .bf-resource-delta[data-direction="spend"] {color:#ffc8a0}
.bf-resource-types {margin-top:2px;gap:2px 3px}
.bf-leader-status .bf-resource-type {
  padding:0 2px;
  border:1px solid #435870;
  border-radius:2px;
  color:#b8c8db;
  font-size:clamp(8px,1.38cqw,10px);
  font-weight:650;
  line-height:1.35;
  white-space:nowrap;
}
.bf-resource-type[data-filled] {
  border-color:#84c5da;
  color:#e6faff;
  background:#164156;
}

.bf-field {
  --rail-ink:#a0b3d0;
  --frame-edge:color-mix(in srgb,var(--rail-ink) 47%,var(--arena-gold));
  position:relative;
  display:grid;
  isolation:isolate;
  grid-template-columns:.44fr repeat(4,1fr) .44fr;
  grid-template-rows:repeat(2,var(--battle-lane-height,clamp(94px,18.6cqw,173px)));
  overflow:hidden;
  border:1px solid var(--frame-edge);
  border-radius:9px;
  margin:0 0 12px;
  background:#131c30;
  box-shadow:0 0 0 1px #111722,0 5px 16px #060c1994,inset 0 0 0 3px #070d1857;
}
.bf-field[data-faction="F"] {--rail-ink:#d2b682}
.bf-field[data-faction="S"] {--rail-ink:#80cfed}
.bf-field[data-faction="O"] {--rail-ink:#b095ee}
.bf-field[data-faction="T"] {--rail-ink:#ed9bb7}
.bf .bf-arena-background {
  position:absolute;
  z-index:-3;
  width:100%;
  height:100%;
  inset:0;
  object-fit:cover;
  object-position:center;
  pointer-events:none;
}
.bf-field::before {
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(ellipse at center,transparent 43%,#090e20b9 100%),
    linear-gradient(90deg,#07192334,transparent 36% 64%,#270f2339);
}
.bf-field::after {
  content:"";
  position:absolute;
  inset:3px;
  z-index:6;
  border-radius:5px;
  background:
    linear-gradient(var(--frame-edge),var(--frame-edge)) left top / 13px 1px,
    linear-gradient(var(--frame-edge),var(--frame-edge)) left top / 1px 13px,
    linear-gradient(var(--frame-edge),var(--frame-edge)) right top / 13px 1px,
    linear-gradient(var(--frame-edge),var(--frame-edge)) right top / 1px 13px,
    linear-gradient(var(--frame-edge),var(--frame-edge)) left bottom / 13px 1px,
    linear-gradient(var(--frame-edge),var(--frame-edge)) left bottom / 1px 13px,
    linear-gradient(var(--frame-edge),var(--frame-edge)) right bottom / 13px 1px,
    linear-gradient(var(--frame-edge),var(--frame-edge)) right bottom / 1px 13px;
  background-repeat:no-repeat;
  pointer-events:none;
}
.bf-rail {
  position:absolute;
  z-index:-1;
  inset:0 0 50%;
  color:#e8f0fc;
  background:linear-gradient(0deg,#0d1728c9 10%,#10203064 22%,transparent 56%);
}
.bf-rail-1 {
  inset:50% 0 0;
  border-top:1px solid color-mix(in srgb,var(--rail-ink) 42%,transparent);
  box-shadow:inset 0 1px 0 #080f1b75;
}
.bf-rail::before {
  content:"";
  position:absolute;
  inset:auto 0 18%;
  height:13%;
  border-block:1px solid color-mix(in srgb,var(--rail-ink) 35%,transparent);
  background:
    linear-gradient(90deg,#79ead51d,transparent 45% 55%,#ff9c991b),
    repeating-linear-gradient(112deg,transparent 0 78px,#b2b8cf20 79px 80px,transparent 81px 133px);
}
.bf-rail::after {
  content:"";
  position:absolute;
  left:50%;
  top:0;
  width:1px;
  height:81%;
  background:linear-gradient(transparent,color-mix(in srgb,var(--rail-ink) 37%,transparent));
}
.bf-rail span {
  position:absolute;
  left:clamp(4px,.9cqw,12px);
  top:clamp(3px,.6cqw,7px);
  padding:1px 4px;
  border-inline-start:2px solid var(--rail-ink);
  background:#0e1829db;
  font-size:clamp(8px,1.6cqw,12px);
  font-weight:700;
  letter-spacing:.06em;
  text-shadow:0 1px 2px #090c15;
}
.bf button.bf-slot {
  --team:var(--arena-player);
  --plate:color-mix(in srgb,var(--team) 30%,transparent);
  position:relative;
  z-index:1;
  min-width:0;
  padding:0;
  border:1px solid transparent;
  border-radius:5px;
  background:none;
}
.bf button.bf-slot.enemy {--team:var(--arena-cpu)}
.bf button.bf-slot:hover:enabled {background:#a4c2ef16}
.bf button.bf-slot.valid {
  border-color:var(--team);
  background:linear-gradient(0deg,color-mix(in srgb,var(--team) 24%,transparent),transparent 79%);
  box-shadow:inset 0 0 0 2px #12303b8c,inset 0 -12px 30px -20px var(--team);
}
.bf-slot::after {
  content:"";
  position:absolute;
  bottom:17%;
  left:13%;
  right:13%;
  height:13%;
  border-radius:50%;
  background:radial-gradient(ellipse,#050913bb 35%,#060b1255 70%,transparent 71%);
  border:1px solid var(--plate);
  box-shadow:0 0 0 3px #05091341;
  pointer-events:none;
}
.bf-slot:is([data-slot="2"],[data-slot="3"])::after {border-style:dashed}
.bf-slot.occupied::after {background:radial-gradient(ellipse,#050913e6 30%,#060b1277 71%)}
.bf-slot.valid::after {border-color:var(--team);box-shadow:0 0 9px var(--plate),inset 0 0 8px var(--plate)}
.bf-slot.shield::after,.bf-slot.blocked::after {border-color:#b0e5ff;box-shadow:0 0 8px #8ad7ff80}
.bf-slot.blocked::after {background:#a5deff77}
.bf-slot-label {
  position:absolute;
  top:4px;
  right:4px;
  padding:0 3px;
  color:#d9e6f3;
  background:#111a2bd9;
  border-radius:2px;
  font-size:clamp(8px,1.55cqw,11px);
  line-height:1.4;
}
.bf-slot.valid .bf-slot-label {color:var(--team);font-weight:800;background:#0b2031}
.bf .bf-sprite {
  position:absolute;
  z-index:2;
  width:clamp(69px,20cqw,170px);
  max-width:none;
  aspect-ratio:80 / 72;
  height:auto;
  bottom:9%;
  left:50%;
  translate:-50%;
  pointer-events:none;
  image-rendering:auto;
}
.bf-slot:is([data-slot="2"],[data-slot="3"]) .bf-sprite {scale:.92;transform-origin:50% 87%}
.bf .bf-sprite[hidden] {display:none}
.bf .enemy .bf-sprite {transform:scaleX(-1)}
.bf-barrier-aura {
  display:none;
  position:absolute;
  z-index:2;
  inset:7% 7% 20%;
  box-sizing:border-box;
  pointer-events:none;
  border:1px solid #b0f6ff;
  border-radius:49% 49% 45% 45%;
  background:radial-gradient(ellipse at 50% 44%,transparent 46%,#03c9ff33 75%,#9df4ff66 100%);
  box-shadow:0 0 7px #54d6ffe0,inset 0 0 8px #68dfffaa;
}
.bf-slot.shield .bf-barrier-aura {display:block}
.bf-barrier-aura::before {
  content:"";
  position:absolute;
  inset:3px;
  border:1px solid transparent;
  border-top-color:#e6fcff;
  border-bottom-color:#71dfff;
  border-radius:inherit;
  transform:rotate(-18deg);

.bf-summon { --summon:#deefff;--spread:clamp(18px,6cqw,54px) }

:is(.bf-cast-notice,.bf-spell-effect)[data-kind="damage"] {--fx:#ffa775}

.bf-cast-announcements {
  position:absolute;
  inset:5px 16% auto;
  z-index:5;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
  pointer-events:none;
}
.bf-cast-notice {
  grid-column:1;
  grid-row:1;
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
  padding:3px 6px 3px 4px;
  color:#f8f3eb;
  border:1px solid color-mix(in srgb,var(--fx) 63%,#283049);
  border-inline-start:3px solid var(--fx);
  border-radius:5px;
  background:linear-gradient(120deg,color-mix(in srgb,var(--fx) 15%,#11182a),#11182afa 67%);
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fx) 42%,transparent),0 2px 9px #080d17bc;
  animation:bf-cast-ribbon var(--cue-duration) var(--cue-age) ease-out both;
}
.bf-cast-notice[data-side="1"] {grid-column:2;flex-direction:row-reverse;text-align:right;background:linear-gradient(-120deg,color-mix(in srgb,var(--fx) 15%,#11182a),#11182afa 67%)}
.bf-cast-notice[data-side="1"] {border-inline-start-width:1px;border-inline-end-width:3px}
.bf-cast-notice img {width:clamp(20px,4.2cqw,34px);aspect-ratio:4/3;object-fit:cover;border-radius:2px;flex:none}
.bf-cast-copy {display:grid;min-width:0;line-height:1.15}
.bf-cast-copy b {font-size:clamp(9px,2cqw,15px);overflow-wrap:anywhere}
.bf-cast-copy small {
  font-size:clamp(8px,1.3cqw,10px);
  color:var(--fx);
  overflow-wrap:anywhere;
}
@keyframes bf-cast-ribbon {
  0% {opacity:0;transform:translateY(-5px)}
  14%,78% {opacity:1;transform:translateY(0)}
  100% {opacity:0;transform:translateY(-2px)}
}

.bf-spell-effect {z-index:1}
.bf-effect-mark {
  position:absolute;
  left:50%;
  top:51%;
  width:clamp(27px,12cqw,92px);
  aspect-ratio:1;
  translate:-50% -50%;
  color:var(--fx);
  animation:bf-effect-halo var(--cue-duration) var(--cue-age) ease-out both;
}
.bf-spell-effect[data-kind="damage"] .bf-effect-mark {
  background:radial-gradient(circle,#fff3da 0%,var(--fx) 28%,#ff6e514a 66%,transparent 78%);
  clip-path:polygon(50% 0,57% 32%,83% 12%,70% 38%,100% 48%,72% 58%,86% 85%,58% 70%,49% 100%,40% 70%,13% 84%,28% 57%,0 50%,30% 43%,14% 16%,43% 32%);
  animation-name:bf-effect-impact;
}
.bf-spell-effect[data-kind="heal"] .bf-effect-mark {
  border:2px solid currentColor;
  border-radius:50%;
  box-shadow:inset 0 0 11px currentColor,0 0 10px currentColor;
  background:radial-gradient(circle,transparent 39%,#8cffbe37 70%);
}
.bf-spell-effect[data-kind="heal"] .bf-effect-mark::after {
  content:"+";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font:800 clamp(16px,5cqw,36px)/1 Consolas,monospace;
  text-shadow:0 0 7px currentColor;
}
.bf-spell-effect:is([data-kind="shield"],[data-kind="block"]) .bf-effect-mark {
  clip-path:polygon(50% 0,91% 15%,89% 59%,50% 100%,11% 59%,9% 15%,50% 0,50% 12%,18% 23%,20% 56%,50% 88%,80% 56%,82% 23%,50% 12%);
  background:linear-gradient(var(--fx),#d8f2ff,var(--fx));
}
.bf-spell-effect:is([data-kind="boost"],[data-kind="weaken"]) .bf-effect-mark {
  width:72%;
  height:54%;
  background:linear-gradient(0deg,transparent,var(--fx));
  clip-path:polygon(0 84%,0 69%,50% 37%,100% 69%,100% 84%,50% 52%,0 84%,0 53%,0 38%,50% 6%,100% 38%,100% 53%,50% 22%,0 53%);
  animation-name:bf-effect-lift;
}
.bf-spell-effect[data-kind="weaken"] .bf-effect-mark {scale:1 -1}
.bf-spell-effect:is([data-kind="summon"],[data-kind="revive"]) .bf-effect-mark {
  top:63%;
  width:75%;
  height:34%;
  border:1px solid currentColor;
  outline:1px dashed currentColor;
  outline-offset:4px;
  border-radius:50%;
  box-shadow:0 0 16px currentColor,inset 0 0 8px currentColor;
}
.bf-spell-effect[data-kind="revive"] .bf-effect-mark {
  border-width:2px;
  height:58%;
  background:radial-gradient(ellipse at bottom,#b48eff6e,transparent 63%);
  animation-name:bf-effect-lift;
}
.bf-spell-effect[data-kind="move"] .bf-effect-mark {
  width:96%;
  height:37%;
  background:linear-gradient(90deg,transparent,var(--fx),transparent);
  clip-path:polygon(0 16%,84% 16%,96% 23%,32% 26%,50% 49%,100% 48%,58% 57%,17% 61%,30% 79%,77% 83%,67% 90%,0 81%);
}
.bf-spell-effect[data-kind="destroy"] .bf-effect-mark {
  background:linear-gradient(135deg,#422858,var(--fx));
  clip-path:polygon(29% 0,43% 34%,100% 0,66% 56%,100% 95%,55% 72%,28% 100%,40% 64%,0 56%,33% 48%,17% 32%);
}
.bf-spell-effect[data-kind="exile"] .bf-effect-mark {
  background:linear-gradient(145deg,#d9fffd,var(--fx),#4e6aa5);
  clip-path:polygon(50% 1%,99% 92%,3% 92%,50% 1%,50% 17%,16% 84%,86% 84%,50% 17%);
  animation-name:bf-exile-fold;
}
@keyframes bf-exile-fold {
  0% {opacity:0;transform:scale(.6)}
  22% {opacity:1;transform:scale(1.12)}
  80% {opacity:.75;transform:scale(.55)}
  100% {opacity:0;transform:scale(.2)}
}
.bf-spell-effect[data-zone="hand"] .bf-effect-mark {display:none}
.bf-effect-value {
  position:absolute;
  left:68%;
  top:18%;
  translate:-50% 0;
  color:var(--fx);
  font:900 clamp(13px,3.1cqw,24px)/1 Consolas,monospace;
  white-space:nowrap;
  paint-order:stroke fill;
  -webkit-text-stroke:3px #12312c;
  text-shadow:0 1px 6px #08111b;
  animation:bf-impact-rise var(--cue-duration) var(--cue-age) ease-out both;
}
.bf-cue-leader.bf-spell-effect .bf-effect-value {left:34%;top:42%}
.bf-spell-effect[data-kind="exile"] .bf-effect-value {left:50%;top:35%;font-size:clamp(11px,2.5cqw,18px)}
.bf-cue-leader.bf-spell-effect[data-side="1"] .bf-effect-value {left:66%}
.bf-cue-leader.bf-spell-effect .bf-effect-mark {left:34%;width:clamp(22px,6cqw,55px)}
.bf-cue-leader.bf-spell-effect[data-side="1"] .bf-effect-mark {left:66%}
.bf-spell-effect[data-zone="hand"] .bf-effect-value {
  top:66%;
  font:750 clamp(9px,1.65cqw,12px)/1.2 "Yu Gothic UI",sans-serif;
  -webkit-text-stroke-color:#201634;
}
@keyframes bf-effect-halo {
  0% {opacity:0;transform:scale(.61)}
  21% {opacity:.76}
  100% {opacity:0;transform:scale(1.28)}
}
@keyframes bf-effect-impact {
  0% {opacity:0;transform:scale(.42) rotate(-9deg)}
  16% {opacity:.91;transform:scale(1.12) rotate(4deg)}
  100% {opacity:0;transform:scale(.85) rotate(9deg)}
}
@keyframes bf-effect-lift {
  0% {opacity:0;transform:translateY(11px)}
  21% {opacity:.79}
  100% {opacity:0;transform:translateY(-15px)}
}
.bf-arena[data-paused] .bf-cast-notice {animation-play-state:paused}
.bf-arena[data-reduced] :is(.bf-cast-notice,.bf-effect-mark,.bf-effect-value) {animation:none}
.bf-arena[data-reduced] .bf-effect-mark {opacity:.44}

.bf-battle-opening {

  border-inline-end:1px solid #94f7e38c;

  background:linear-gradient(90deg,transparent,#162338f7 21%,#242137f5 48%,#162338f7 79%,transparent);

  top:-1px;
  width:clamp(4px,.9cqw,10px);

.bf-battle-opening[data-hidden],.bf-battle-opening[data-hidden] strong,

.bf-arena[data-reduced] :is(.bf-battle-opening,.bf-battle-opening strong),
.bf-arena[data-reduced] .bf-battle-opening::before,.bf-arena[data-reduced] .bf-battle-opening::after {animation:none}
@keyframes bf-opening-shade {
  0% {opacity:.42}
  16%,77% {opacity:1}
  100% {opacity:0}
}
@keyframes bf-opening-title {
  0% {opacity:0;transform:scaleX(1.24) scaleY(.49)}
  17% {opacity:1;transform:scale(1.045)}
  29%,77% {opacity:1;transform:scale(1)}
  100% {opacity:0;transform:translateY(-.12em)}

  function missionStatus(p,x){
    const stages=p.missionRevision?missionStages:missionStages.slice(0,1);
    const cleared=clearedMissionStages(x), index=Math.min(cleared,stages.length-1);
    const tasks=stages[index].tasks.map((task,i)=>{
      const done=x.missions.includes(index*tasksPerStage+i);
      const value=index===0?[x.placements,0,x.won.length][i]:x.missionProgress?.[i];
      const progress=done?task.goal:Math.min(task.goal,task.distinct?value?.length??0:value??0);
      return {...task,done,progress};
    });
    return {stage:index+1,name:stages[index].name,tasks,total:stages.length*tasksPerStage,stages:stages.length,
      complete:cleared===stages.length,history:stages.slice(0,index)};
  }

    const index=clearedMissionStages(x), stage=missionStages[index];

      const counters={...b.missionStats,win,story,faction,enemy,hp:b.sides[0].hp,bothLanes:b.hits[0]===3,
        standardWin:win&&!story&&difficulty>=1,expertWin:win&&!story&&difficulty===2,light:0,boost:0,moves:0};
      for(const action of b.replay){
        if(action.side!==0)continue;
        if(action.mode==='light')counters.light++;
        if(action.mode==='boost')counters.boost++;
        if(action.dest!==undefined)counters.moves++;
      }
      const progress=x.missionProgress??=[null,null,null];

        const id=index*tasksPerStage+i;
        if(x.missions.includes(id))continue;
        const delta=task.measure(counters);

        }
      }

    if(chosen.size){

(function (K) {
  'use strict';
  const B=K.Boundary;
  const tiers = {
    N: {ticks:7, sparks:0},
    R: {ticks:10, sparks:4},
    SR:{ticks:14, sparks:8},
    UR:{ticks:18, sparks:12}
  };
  const damageTicks = 20;
  const effectTicks = 16;
  const castTicks = 20;
  const labels = {
    damage:'ダメージ', heal:'回復', boost:'強化', weaken:'弱体化', shield:'バリア', block:'バリア',
    summon:'召喚', revive:'蘇生', discount:'コスト軽減', move:'移動', destroy:'破壊', exile:'追放',
    restoreCost:'コスト回復', speedUpCost:'コスト回復加速'
  };

  K.Boundary.createEffects = function (project, field, slots, hud) {
    function el(tag, className, label) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (label) node.textContent = label;
      return node;
    }

    const fieldOverlay = el('div', 'bf-field-effects');
    const leaderOverlay = el('div', 'bf-leader-effects');
    const announcements = el('div', 'bf-cast-announcements');
    fieldOverlay.setAttribute('aria-hidden', 'true');
    leaderOverlay.setAttribute('aria-hidden', 'true');
    announcements.setAttribute('aria-hidden','true');
    field.append(fieldOverlay,announcements);
    hud.append(leaderOverlay);

    const spells = el('div', 'bf-spells');
    const panels = ['自分のスペル', '相手のスペル'].map((label, side) => {
      const details = el('details', 'bf-spell');
      details.dataset.side = side;
      const summary = el('summary');
      const history = el('ol', 'bf-spell-history');
      const icon = el('img');
      icon.alt = '';
      icon.hidden = true;
      const caption = el('div', 'bf-spell-caption');
      const title = el('strong', '', '未使用');
      title.setAttribute('aria-live', 'polite');
      caption.append(el('small', '', label), title);
      summary.append(icon, caption);
      details.append(summary, history);
      spells.append(details);

    function updateSpells(battle) {
      for (const [side, panel] of panels.entries()) {
        const casts = battle.feedback.spells[side];
        const last = casts.at(-1);
        if (!last || last.sequence === panel.seen) continue;
        const card = project.cards[last.card];
        panel.seen = last.sequence;
        panel.icon.src = K.boundaryArt[last.card];
        panel.icon.hidden = false;
        const title = el('span', '', card.name + (last.blank?'（空撃ち）':last.mode?'（'+B.modeLabels[last.mode]+'）':''));
        if (battle.tick-last.tick<5) title.className = 'bf-spell-cast';
        panel.title.replaceChildren(title);
        panel.history.replaceChildren(...casts.slice().reverse().map(cast => {
          const definition = project.cards[cast.card];
          const entry = el('li');
          entry.append(el('strong', '', definition.name), el('span', '',
            cast.blank?'空撃ち':cast.mode==='light'?definition.evoke.text:cast.mode==='boost'?definition.text+'　'+definition.enhance.text:definition.text));

        node.dataset.side=event.side;

        node.classList.toggle('bf-block', event.amount === 0);
        node.classList.toggle('bf-leader-hit', event.slot === undefined);

        if (event.amount === 0) amount.append(el('small', '', 'バリア'));
        node.append(el('i','bf-impact-flash'),amount);

        const rarity = project.cards[event.card].rarity;
        node.classList.add('bf-summon');
        node.dataset.rarity = rarity;
        node.append(el('i', 'bf-summon-ring'));
        if (rarity !== 'N') node.append(el('i', 'bf-summon-ring bf-summon-orbit'));
        if (rarity === 'SR' || rarity === 'UR') node.append(el('i', 'bf-summon-beam'));
        if (rarity === 'UR') node.append(el('i', 'bf-summon-crest'));

      node.dataset.kind=cast.effects[0]?.kind||'neutral';

      art.src=K.boundaryArt[cast.card];
      const title=el('b','',project.cards[cast.card].name);

      const action=cast.blank?'空撃ち':(cast.mode?B.modeLabels[cast.mode]:(categories.join('・')||'発動'));
      const header=el('span','bf-cast-copy');
      header.append(el('small','',(side===0?'自分':'相手')+' · '+action),title);
      node.append(art,header);
      animateAge(node,battle,cast,castTicks);
      announcements.append(node);
      return node;
    }

    function addSpellEffect(battle,effect) {
      const node=el('div','bf-cue-cell bf-spell-effect');
      node.dataset.kind=effect.kind;
      node.dataset.zone=effect.zone;
      node.append(el('i','bf-effect-mark'));
      if(effect.kind==='heal') node.append(el('b','bf-effect-value','+'+effect.amount));
      if(effect.kind==='restoreCost') node.append(el('b','bf-effect-value','コスト ＋'+effect.amount));
      if(effect.kind==='speedUpCost') node.append(el('b','bf-effect-value','回復速度 ×2'));
      if(effect.kind==='exile') node.append(el('b','bf-effect-value','追放'));
      if(effect.zone==='hand') node.append(el('b','bf-effect-value',labels[effect.kind]));
      animateAge(node,battle,effect,effectTicks);
      position(node,effect);
      return node;
    }

    function update(battle, reduced) {
      if (lastTick === battle.tick && lastSequence === battle.feedback.serial && lastReduced === reduced) return;
      lastTick = battle.tick;
      lastSequence = battle.feedback.serial;
      lastReduced = reduced;
      updateSpells(battle);
      const active = new Map();
      for (const event of battle.feedback.cues) {
        if(event.kind==='summon'&&reduced)continue;
        const status=event.kind==='move'||event.zone==='hand';
        const duration=event.kind==='damage'?damageTicks:status?effectTicks:tiers[project.cards[event.card].rarity].ticks;
        if (battle.tick-event.tick >= duration) continue;
        // Resolve all attacks in a tick before displaying a combined value over each recipient.
        const key = event.kind === 'damage' ? [event.kind,event.tick,event.side,event.slot,event.uid].join('/') : event.sequence;
        const earlier = active.get(key);
        if (earlier) earlier.event.amount += event.amount;
        else active.set(key,{event:{...event},add:event=>status?addSpellEffect(battle,{...event,zone:event.zone??'board'}):add(battle,event,duration)});
      }
      for(const [side,casts] of battle.feedback.spells.entries()){
        const latest=casts.at(-1);
        if(latest&&battle.tick-latest.tick<castTicks)active.set('cast/'+latest.sequence,{add:()=>addCast(battle,latest,side)});
        for(const cast of casts){
          if(battle.tick-cast.tick>=effectTicks)continue;
          for(const effect of cast.effects){
            const key=['effect',cast.sequence,effect.kind,effect.zone,effect.side,effect.slot].join('/');
            const earlier=active.get(key);

              active.set(key,{event:{...effect,tick:cast.tick},add:event=>addSpellEffect(battle,event)});
            }
          }

        if (!active.has(key)) { node.remove(); visible.delete(key); }
      }
      for (const [key,entry] of active) {
        if (!visible.has(key)) visible.set(key,entry.add(entry.event));
      }
    }
    return {spells, update};
  };

      const label=room.disconnected?'通信が途切れました。再接続しています。':
        room.busy?'対戦サーバーと通信しています。':
        room.phase==='opening'?'対戦相手が最初の手札を確定するのを待っています。':
        waiting?(random?'対戦相手を探しています。相手が見つかると手札の選択に進みます。':'相手が招待リンクを開いて参加するのを待っています。'):

        const clock=el('p');clock.dataset.matchClock='search';

      main.append(panel);

ariant":2,"difficulty":1,"hp":[25,20],"cost":[4,3],"units":[[1,2,"S01"]],"intro":"検問所に係員はいない。作業ポッドが後列から指示を受信し、巡察機を次々と起動する。発信元を追うため、信号が途切れる前に巡察機を退けたい。","outro":"信号は人間が送ったものではなかった。避難命令が毎回数分先の時刻から到着し、そのたびに通過した町の座標が上書きされていく。"},{"title":"第二戦 35秒の遮断","enemy":"三系統の封鎖部隊","faction":"S","variant":3,"difficulty":1,"cost":[4,2],"goal":{"kind":"survive","ticks":700},"intro":"仲間が端末の遮断にかかる。必要なのは35秒。その間、ロボットとビークルを組み合わせて前に出る部隊からリーダーを守ろう。","outro":"次の命令だけが途切れた。発信元が露わになる。地図から廃止されたはずの駅に、すべての認証記録が集まっている。"}],[{"title":"第一戦 消された台帳","enemy":"記録回収官","faction":"O","variant":3,"difficulty":1,"hp":[25,20],"cost":[4,3],"units":[[1,2,"O38"]],"intro":"駅の名簿には到着していない乗客が書かれ、今ここにいる子どもの欄だけが空白だった。回収官は保全を名目に台帳を没収する。証拠を集める巡回兵がすでに後列にいる。","outro":"回収官は消去の命令に従っていただけだった。誰かを避難済みと記録するたびに、その人の本来の帰り先が地図から消えていた。"},{"title":"第二戦 帰路のない乗換口","enemy":"峠から来た追跡影","faction":"O","variant":1,"difficulty":1,"hp":[25,18],"cost":[5,2],"units":[[1,0,"O50"]],"goal":{"kind":"rush","ticks":1300},"intro":"閉鎖された乗換口の先に、まだ上書きされていない記録がある。追跡影は倒れた仲間を呼び戻す。65秒後の列車が発つ前に、記録を確保しよう。","outro":"記録の最終行は撮影街を指していた。次に消えるのは街の住民。古い番組表に、避難警報と同じ図柄の合図が見える。"}],[{"title":"第一戦 警報で始まる芝居","enemy":"港湾の防衛隊","faction":"T","variant":6,"difficulty":1,"hp":[25,22],"cost":[4,3],"units":[[1,2,"T66"]],"intro":"警報のたびに撮影街の配役が入れ替わる。最初は住民を守っていた防衛隊も、台本の命令で避難列車を敵と認識してしまう。後列のライダーから変身信号が届いた。","outro":"警報の隙間で隊員がかすれた声を上げた。「怪獣は避難先を壊しているんじゃない。あそこから出られないんだ」"},{"title":"第二戦 壊れた最終回","enemy":"暴走した舞台怪獣","faction":"T","variant":3,"difficulty":1,"hp":[25,22],"cost":[5,2],"units":[[0,1,"G02"],[1,0,"T42"]],"boss":true,"intro":"今日の最終回を終えるまで、同じ街と同じ被害が繰り返される。住民を下ラインから逃がすため、渡し場の番人が先に場に出た。怪獣を上ラインで引き受けよう。","outro":"街の時計がようやく進んだ。警報器の起動音と無人駅の信号は同一だった。星幕の隊員は、継界炉の端末を閉じる手順を書き残す。"}],[{"title":"第一戦 先回りする命令","enemy":"零重力区画の防衛機","faction":"S","variant":5,"difficulty":1,"hp":[25,21],"cost":[5,3],"units":[[1,2,"S26"]],"intro":"継界炉は四世界を一箇所に避難させようとし、相容れない座標をそのまま重ねていた。自律管制官に届く前に、防衛機が集まる零重力区画を抜ける。","outro":"灯路が経路を確保し、工廠が電力を切り分ける。零時観測局は名簿を元に戻し、星幕が残った住民を誘導する。最後の端末だけがまだ閉じない。"},{"title":"第二戦 最後の避難命令","enemy":"継界
